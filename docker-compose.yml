version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=aviator_db
      - POSTGRES_USER=aviator_user
      - POSTGRES_PASSWORD=secure_password_here

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DB_NAME=aviator_db
      - DB_USER=aviator_user
      - DB_PASSWORD=secure_password_here
      - DB_HOST=db
      - REDIS_HOST=redis
      # ඩොමේන් එක එකතු කරන්න
      - ALLOWED_HOSTS=1xplane.com,www.1xplane.com,localhost,127.0.0.1,164.68.123.57

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # මෙතන ඩොමේන් එක HTTPS එක්ක දාන්න
      - NEXT_PUBLIC_API_URL=https://1xplane.com

volumes:
  postgres_data: